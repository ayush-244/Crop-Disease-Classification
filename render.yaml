services:
  - type: web
    name: crop-disease-classifier
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --pythonpath backend app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
